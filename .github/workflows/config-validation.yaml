name: Config Validation

on:
  push:
    paths:
      - "meta-iotgw/recipes-iotgw/iotgwd/files/**"
      - "meta-iotgw/recipes-core/iotgw/iotgw-wifi-ssh/**"
      - "scripts/validate_cfg.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/config-validation.yaml"
  pull_request:
    paths:
      - "meta-iotgw/recipes-iotgw/iotgwd/files/**"
      - "meta-iotgw/recipes-core/iotgw/iotgw-wifi-ssh/**"
      - "scripts/validate_cfg.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/config-validation.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/validate_cfg.py
            meta-iotgw/recipes-iotgw/iotgwd/files/
            meta-iotgw/recipes-core/iotgw/iotgw-wifi-ssh/wpa_supplicant-wlan0.conf
            tests/
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q
